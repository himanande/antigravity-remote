name = "antigravity-remote-relay"
main = "src/worker.ts"
compatibility_date = "2026-06-01"

# テナント=room ごとに 1 インスタンスへ集約する Durable Object
[[durable_objects.bindings]]
name = "RELAY_ROOM"
class_name = "RelayRoom"

# 接続レート制限(1 IP = 1 DO)。TASK-22 / F18
[[durable_objects.bindings]]
name = "RATE_GATE"
class_name = "RateGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateGate"]

# スマホPWA(client/)を同じworkerで配信する。静的ファイルに一致しない
# リクエスト(/ws, /health)は default export の fetch に落ちる。
# → 1ドメイン・1回のdeployでリレーとPWAが完結。clientBaseUrl設定は不要になる。
[assets]
directory = "../client"

[observability]
enabled = true
# 注: Workers の Rate Limiting binding([[ratelimits]])は、本番デプロイして
# 実WebSocket接続90本/25秒で試しても一度も発火せず、実効を確認できなかった(F18)。
# 公開サービスの防御を実証できない機構に預けないため、RateGate DO で自前実装している。
