name = "antigravity-remote-relay"
main = "src/worker.ts"
compatibility_date = "2026-06-01"

# テナント=room ごとに 1 インスタンスへ集約する Durable Object
[[durable_objects.bindings]]
name = "RELAY_ROOM"
class_name = "RelayRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

# スマホPWA(client/)を同じworkerで配信する。静的ファイルに一致しない
# リクエスト(/ws, /health)は default export の fetch に落ちる。
# → 1ドメイン・1回のdeployでリレーとPWAが完結。clientBaseUrl設定は不要になる。
[assets]
directory = "../client"

[observability]
enabled = true

# 接続レート制限(TASK-22)。DO を作る前に fetch で効かせる。
# period は 10 か 60 のみ。制限はコロケーション単位・結果整合なので、
# 精密な会計ではなく「明らかな洪水を止める」用途。
[[ratelimits]]
name = "CONN_LIMIT_IP"
namespace_id = "1001"

[ratelimits.simple]
limit = 60
period = 60

[[ratelimits]]
name = "CONN_LIMIT_ROOM"
namespace_id = "1002"

[ratelimits.simple]
limit = 120
period = 60
