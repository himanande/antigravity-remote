name = "antigravity-remote-relay"
main = "src/worker.ts"
compatibility_date = "2026-06-01"

# routes を設定すると workers.dev は既定で無効になる。旧URL
# (antigravity-remote-relay.<sub>.workers.dev)を設定済みの利用者が
# 切れてしまうため、移行期間は明示的に有効のままにしておく。
workers_dev = true

# マネージドリレーの公開URL。拡張の既定 relayUrl に埋め込むため、
# **一度出荷したら変更できない**前提で扱う(旧バージョンの利用者が見続けるURL)。
# workers.dev ではなく独自ドメインにしてあるのは、将来リレーを別基盤へ移しても
# このURLを維持できるようにするため。
[[routes]]
pattern = "relay.termhop.dev"
custom_domain = true

# apex はスマホPWAの配信用(QRに埋まるURL、将来のTWAの assetlinks.json 置き場)。
# 同じ worker が両方を担うので追加コストはない。
[[routes]]
pattern = "termhop.dev"
custom_domain = true

# テナント=room ごとに 1 インスタンスへ集約する Durable Object
[[durable_objects.bindings]]
name = "RELAY_ROOM"
class_name = "RelayRoom"

# 接続レート制限(1 IP = 1 DO)。TASK-22 / F18
[[durable_objects.bindings]]
name = "RATE_GATE"
class_name = "RateGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateGate"]

# 軽量テレメトリ(TASK-27 / ADR-009)。日ごとに1インスタンス。
[[durable_objects.bindings]]
name = "STATS"
class_name = "StatsDay"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["StatsDay"]

# スマホPWA(client/)を同じworkerで配信する。静的ファイルに一致しない
# リクエスト(/ws, /health)は default export の fetch に落ちる。
# → 1ドメイン・1回のdeployでリレーとPWAが完結。clientBaseUrl設定は不要になる。
[assets]
directory = "../client"

[observability]
enabled = true
# 注: Workers の Rate Limiting binding([[ratelimits]])は、本番デプロイして
# 実WebSocket接続90本/25秒で試しても一度も発火せず、実効を確認できなかった(F18)。
# 公開サービスの防御を実証できない機構に預けないため、RateGate DO で自前実装している。
